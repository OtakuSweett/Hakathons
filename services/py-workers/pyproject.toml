[project]
name = "py-workers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.14",
    "uvicorn==0.34.3",
    "numpy==2.2.2",
    "scipy==1.14.1",
    "pulp==3.3.2",
    "highspy==1.16.0",
    "pydantic>=2.10.6",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["physics_worker/tests", "optimizer_worker/tests"]
asyncio_mode = "auto"
