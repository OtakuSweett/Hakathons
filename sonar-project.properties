# SonarCloud Configuration for NASA Agro-DSS
sonar.projectKey=OtakuSweett_NASA-Agro-DSS
sonar.organization=otakusweett
sonar.projectName=NASA-Agro-DSS

# Source code directories to analyze
sonar.sources=apps/web/src,apps/orchestrator/src,services/py-workers

# Test directories
sonar.tests=apps/web/tests,apps/orchestrator/tests,services/py-workers/physics_worker/tests,services/py-workers/optimizer_worker/tests

# Exclusions to prevent duplicate code flags on static benchmark JSON datasets and markdown documents
sonar.exclusions=data/**,docs/**,packages/**,**/*.json,**/*.md,**/*.odt,**/*.ods,**/dist/**,**/node_modules/**,**/.venv/**
sonar.cpd.exclusions=data/**,**/*.json,apps/web/src/services/mockData.ts,**/*.test.ts,**/*.spec.ts,**/tests/**
